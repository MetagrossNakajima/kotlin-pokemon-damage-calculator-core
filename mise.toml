[tools]
java = "temurin-26.0.2+101"

[tasks.build]
description = "ライブラリのビルドと検証"
run = "./gradlew build"

[tasks.test]
description = "テストを実行"
run = "./gradlew test"

[tasks.check]
description = "検証タスクを実行"
run = "./gradlew check"

[tasks.clean]
description = "ビルド成果物を削除"
run = "./gradlew clean"

[tasks.format]
description = "Kotlinコードを100文字幅で整形"
run = "./gradlew spotlessApply"

[tasks.metadata]
description = "共通Kotlinメタデータをコンパイル"
run = "./gradlew compileCommonMainKotlinMetadata"

[tasks."format:check"]
description = "Kotlinの整形を検証"
run = "./gradlew spotlessCheck"
